[package]
name = "codex-rb-launch-guard"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
rb-managed-sandbox-feasibility = []

[lib]
name = "codex_rb_launch_guard"
path = "src/lib.rs"
doctest = true

[[bin]]
name = "rb-launch-guard"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
codex-sandboxing = { path = "../sandboxing" }
codex-utils-absolute-path = { path = "../utils/absolute-path" }
codex-utils-bounded-lines = { workspace = true }
codex-utils-pty = { path = "../utils/pty" }
libc = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
security-framework = "3"

[dev-dependencies]
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
libsqlite3-sys = { workspace = true, features = ["min_sqlite_version_3_34_1"] }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["parsing"] }
